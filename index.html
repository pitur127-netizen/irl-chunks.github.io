<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odkrywca Świata</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Licznik punktów w prawym górnym rogu */
        #score-board {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }

        #status {
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Licznik punktów -->
    <div id="score-board">Punkty: <span id="points">0</span></div>

    <!-- Status GPS -->
    <div id="status">
        <h2>Wyszukiwanie sygnału GPS...</h2>
        <p id="coordinates">Zezwól na dostęp do lokalizacji.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
